name: release
# 触发: 推 v* tag 自动跑, 或手工 dispatch.
# 仓库还未推到 GitHub 时此文件不会执行, 推上去自动生效.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: windows }
          - { os: windows-latest, target: windows-legacy, need_nightly: true }
          - { os: ubuntu-22.04,   target: linux }
          - { os: ubuntu-22.04,   target: linux-cli-musl }
          - { os: macos-latest,   target: macos }
    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.target }})
    steps:
      - uses: actions/checkout@v6

      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install rust nightly + rust-src (windows-legacy)
        if: matrix.need_nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-10
          components: rust-src

      # Tauri 需要 WebKitGTK 4.1 / GTK3 开发包
      - name: install linux tauri deps
        if: matrix.target == 'linux'
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libssl-dev libxdo-dev build-essential pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/app-tauri/univer-editor/package-lock.json

      # musl 静态链需要 musl-tools
      - name: install musl-tools
        if: matrix.target == 'linux-cli-musl'
        run: sudo apt update && sudo apt install -y musl-tools

      - name: cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: build
        shell: bash
        env:
          NIGHTLY_TOOLCHAIN: nightly-2026-11-10
        run: |
          if [ "${{ matrix.target }}" = "windows-legacy" ]; then
            bash scripts/build-windows-legacy.sh
          else
            bash scripts/release.sh "${{ matrix.target }}"
          fi

      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tablet-${{ matrix.target }}
          path: dist/${{ matrix.target }}/

  # tag 触发时聚合所有产物到 GitHub Release
  # 命名规则: {二进制}-{平台}[.exe], 不再打 zip, 直接挂裸文件
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # 算 changelog 要历史

      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: rename binaries
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/release
          for d in dist/tablet-*/; do
            target="${d#dist/tablet-}"; target="${target%/}"
            for f in "$d"*; do
              base="$(basename "$f")"
              case "$target:$base" in
                windows:tablet.exe)     out="tablet-${version}-windows10-1803-x64.exe" ;;
                windows:tablet-cli.exe) out="tablet-cli-${version}-windows-x64.exe" ;;
                linux:tablet)           out="tablet-${version}-linux22.04-x64" ;;
                linux:tablet-cli)       out="tablet-cli-${version}-linux-x64" ;;
                linux-cli-musl:tablet-cli) out="tablet-cli-${version}-linux-musl-x64" ;;
                macos:tablet)           out="tablet-${version}-macos10.15-universal" ;;
                macos:tablet-cli)       out="tablet-cli-${version}-macos10.15-universal" ;;
                windows-legacy:*.zip)   out="$base" ;;
                *:*.deb)                out="$base" ;;
                *:*.dmg)                out="$base" ;;
                *:*.app.zip)            out="$base" ;;
                *) echo "跳过: $f" >&2; continue ;;
              esac
              cp -r "$f" "dist/release/$out"
            done
          done
          chmod +x dist/release/tablet-* 2>/dev/null || true
          ls -lh dist/release/

      - name: build release notes
        # 上半: 自上一个 tag 起的 commit 列表 (无前序 tag 时退化为最近 50 条)
        # 下半: 各产物的固定说明表格
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          ver="${tag#v}"   # 产物名里的版本号（tag 带 v，Cargo 版本不带）
          prev="$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)"
          {
            echo "## 改动 (${prev:-初始}..${tag})"
            echo
            if [ -n "$prev" ]; then
              git log --pretty=format:'- %s (%h)' "$prev..$tag"
            else
              git log -50 --pretty=format:'- %s (%h)'
            fi
            echo
            echo
            echo "## 产物说明"
            echo
            echo "| 文件 | 平台 / 最低版本 | 形态 | 运行时要求 | 说明 |"
            echo "|---|---|---|---|---|"
            echo "| tablet-${ver}-windows10-1803-x64.exe | Windows 10 1803+ / 11 x64 | 便携 GUI | WebView2（Win11 自带；Win10 一般随 Edge 安装） | 推荐 |"
            echo "| tablet-cli-${ver}-windows-x64.exe | Windows 10 x64 | CLI | 无 | Jenkins / 自动化 |"
            echo "| tablet-${ver}-windows-legacy-win7-win10lt1803-x64.zip | Win7 SP1 / 8.1 / Win10 <1803 | ZIP 套件 | 固定版 WebView2 109（包内附说明） | 实验性，无安全更新 |"
            echo "| tablet_${ver}_amd64.deb | Ubuntu 22.04+ / Debian 12+ | deb | WebKitGTK 4.1 | apt 安装 |"
            echo "| tablet-${ver}-linux22.04-x64 | 同上（glibc 2.35+） | 便携 GUI | WebKitGTK 4.1 / GTK3 | 解压即用 |"
            echo "| tablet-cli-${ver}-linux-x64 | x86_64 Linux (glibc) | CLI | 动态链 | Jenkins / 自动化 |"
            echo "| tablet-cli-${ver}-linux-musl-x64 | 任意 x86_64 Linux | 静态 CLI | 无 | 老 glibc / Alpine / 容器 |"
            echo "| tablet-${ver}-macos10.15-universal | macOS 10.15+ | GUI 便携 | 系统 WKWebView | intel + arm64，未签名 |"
            echo "| tablet-cli-${ver}-macos10.15-universal | macOS 10.15+ | CLI | 无 | 同上 |"
            echo "| Tablet-${ver}.app.zip | macOS 10.15+ | GUI 便携包 | 系统 WKWebView | 解压直接运行 |"
            echo "| Tablet-${ver}.dmg | macOS 10.15+ | GUI 安装包 | 系统 WKWebView | 拖入 Applications |"
          } > release-notes.md
          cat release-notes.md

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release/*
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
