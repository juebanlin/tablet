name: release
# 触发: 推 v* tag 自动跑, 或手工 dispatch.
# 仓库还未推到 GitHub 时此文件不会执行, 推上去自动生效.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: windows,        need_nightly: false }
          - { os: windows-latest, target: windows-win7,   need_nightly: true  }
          - { os: ubuntu-latest,  target: linux,          need_nightly: false }
          - { os: ubuntu-latest,  target: linux-cli-musl, need_nightly: false }
          - { os: macos-latest,   target: macos,          need_nightly: false }
    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.target }})
    steps:
      - uses: actions/checkout@v6

      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install rust nightly + rust-src
        if: matrix.need_nightly
        # 钉死 nightly 日期: Tier 3 target 走 -Z build-std, nightly 偶尔会改 flag (例如
        # 2026-06 把 panic_immediate_abort 从 build-std-features 提升为正式 panic 策略),
        # 不钉死会反复炸 CI. 验证过没问题再手动 bump.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-07
          components: rust-src

      # Linux GUI target 需要的系统依赖: OpenGL + 字体 + xcb (winit)
      - name: install linux gui deps
        if: matrix.target == 'linux'
        run: |
          sudo apt update
          sudo apt install -y \
            libgl1-mesa-dev libfontconfig1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev

      # musl 静态链需要 musl-tools
      - name: install musl-tools
        if: matrix.target == 'linux-cli-musl'
        run: sudo apt update && sudo apt install -y musl-tools

      - name: cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: build
        shell: bash
        run: bash scripts/release.sh ${{ matrix.target }}

      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tablet-${{ matrix.target }}
          path: dist/${{ matrix.target }}/

  # tag 触发时聚合所有产物到 GitHub Release
  # 命名规则: {二进制}-{平台}[.exe], 不再打 zip, 直接挂裸文件
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # 算 changelog 要历史

      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: rename binaries
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/release
          for d in dist/tablet-*/; do
            target="${d#dist/tablet-}"; target="${target%/}"
            for f in "$d"*; do
              base="$(basename "$f")"
              case "$base" in
                tablet.exe)     out="tablet-${version}-${target}.exe" ;;
                tablet-cli.exe) out="tablet-cli-${version}-${target}.exe" ;;
                tablet)         out="tablet-${version}-${target}" ;;
                tablet-cli)     out="tablet-cli-${version}-${target}" ;;
                *.deb)          out="$base" ;;
                *.dmg)          out="$base" ;;
                *.app.zip)      out="$base" ;;
                *) echo "跳过: $f" >&2; continue ;;
              esac
              cp -r "$f" "dist/release/$out"
            done
          done
          chmod +x dist/release/tablet-* 2>/dev/null || true
          ls -lh dist/release/

      - name: build release notes
        # 上半: 自上一个 tag 起的 commit 列表 (无前序 tag 时退化为最近 50 条)
        # 下半: 9 个产物的固定说明表格
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          prev="$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)"
          {
            echo "## 改动 (${prev:-初始}..${tag})"
            echo
            if [ -n "$prev" ]; then
              git log --pretty=format:'- %s (%h)' "$prev..$tag"
            else
              git log -50 --pretty=format:'- %s (%h)'
            fi
            echo
            echo
            echo "## 产物说明"
            echo
            echo "| 文件 | 平台 | 类型 | 备注 |"
            echo "|---|---|---|---|"
            echo "| tablet-{ver}-windows.exe | Windows 10/11 x64 | GUI | VC++ runtime 静态链, 免装可再发行包 |"
            echo "| tablet-cli-{ver}-windows.exe | Windows 10/11 x64 | CLI | 同上 |"
            echo "| tablet-{ver}-windows-win7.exe | Windows 7 SP1 x64 | GUI | Tier 3, nightly + build-std |"
            echo "| tablet-cli-{ver}-windows-win7.exe | Windows 7 SP1 x64 | CLI | 同上 |"
            echo "| tablet-{ver}-linux | x86_64 Linux (glibc) | GUI | 需 libgl1 / libfontconfig1 / fonts-noto-cjk |"
            echo "| tablet-cli-{ver}-linux | x86_64 Linux (glibc) | CLI | 动态链 |"
            echo "| tablet-cli-{ver}-linux-cli-musl | x86_64 Linux (any) | CLI | 全静态链, 任意 Linux 直接跑 |"
            echo "| tablet_{ver}_amd64.deb | Debian/Ubuntu x64 | GUI+CLI | apt 安装, 含 .desktop + 图标 |"
            echo "| tablet-{ver}-macos | macOS 10.13+ universal | GUI | intel + arm64, 未签名 |"
            echo "| tablet-cli-{ver}-macos | macOS 10.13+ universal | CLI | 同上 |"
            echo "| Tablet-{ver}.app.zip | macOS 10.13+ universal | GUI 便携包 | 解压直接运行 |"
            echo "| Tablet-{ver}.dmg | macOS 10.13+ universal | GUI 安装包 | 拖入 Applications |"
          } > release-notes.md
          cat release-notes.md

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release/*
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
