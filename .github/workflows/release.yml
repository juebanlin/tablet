name: release
# 触发: 推 v* tag 自动跑, 或手工 dispatch.
# 仓库还未推到 GitHub 时此文件不会执行, 推上去自动生效.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: windows }
          - { os: ubuntu-22.04,   target: linux }
          - { os: ubuntu-22.04,   target: linux-cli-musl }
          - { os: macos-latest,   target: macos }
    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.target }})
    steps:
      - uses: actions/checkout@v6

      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable

      # Tauri 需要 WebKitGTK 4.1 / GTK3 开发包
      - name: install linux tauri deps
        if: matrix.target == 'linux'
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libssl-dev libxdo-dev build-essential pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/app-tauri/univer-editor/package-lock.json

      # musl 静态链需要 musl-tools
      - name: install musl-tools
        if: matrix.target == 'linux-cli-musl'
        run: sudo apt update && sudo apt install -y musl-tools

      - name: cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: build
        shell: bash
        run: bash scripts/release.sh ${{ matrix.target }}

      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tablet-${{ matrix.target }}
          path: dist/${{ matrix.target }}/

  # tag 触发时聚合所有产物到 GitHub Release
  # 命名规则: {二进制}-{平台}[.exe], 不再打 zip, 直接挂裸文件
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # 算 changelog 要历史

      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: rename binaries
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/release
          for d in dist/tablet-*/; do
            target="${d#dist/tablet-}"; target="${target%/}"
            for f in "$d"*; do
              base="$(basename "$f")"
              case "$base" in
                tablet.exe)     out="tablet-${version}-${target}.exe" ;;
                tablet-cli.exe) out="tablet-cli-${version}-${target}.exe" ;;
                tablet)         out="tablet-${version}-${target}" ;;
                tablet-cli)     out="tablet-cli-${version}-${target}" ;;
                *.deb)          out="$base" ;;
                *.dmg)          out="$base" ;;
                *.app.zip)      out="$base" ;;
                *) echo "跳过: $f" >&2; continue ;;
              esac
              cp -r "$f" "dist/release/$out"
            done
          done
          chmod +x dist/release/tablet-* 2>/dev/null || true
          ls -lh dist/release/

      - name: build release notes
        # 上半: 自上一个 tag 起的 commit 列表 (无前序 tag 时退化为最近 50 条)
        # 下半: 各产物的固定说明表格
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          ver="${tag#v}"   # 产物名里的版本号（tag 带 v，Cargo 版本不带）
          prev="$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)"
          {
            echo "## 改动 (${prev:-初始}..${tag})"
            echo
            if [ -n "$prev" ]; then
              git log --pretty=format:'- %s (%h)' "$prev..$tag"
            else
              git log -50 --pretty=format:'- %s (%h)'
            fi
            echo
            echo
            echo "## 产物说明"
            echo
            echo "| 文件 | 平台 | 类型 | 备注 |"
            echo "|---|---|---|---|"
            echo "| tablet-${ver}-windows.exe | Windows 10 1803+/11 x64 | GUI (Tauri) | 需 WebView2 运行时（Win11 自带） |"
            echo "| tablet-cli-${ver}-windows.exe | Windows 10/11 x64 | CLI | 无需 WebView2 |"
            echo "| tablet-${ver}-linux | x86_64 Linux (glibc) | GUI (Tauri) | 需 WebKitGTK 4.1 / GTK3；建议 fonts-noto-cjk |"
            echo "| tablet-cli-${ver}-linux | x86_64 Linux (glibc) | CLI | 动态链 |"
            echo "| tablet-cli-${ver}-linux-cli-musl | x86_64 Linux (any) | CLI | 全静态链, 任意 Linux 直接跑 |"
            echo "| tablet_${ver}_amd64.deb | Debian/Ubuntu x64 | GUI+CLI | apt 安装, 依赖 WebKitGTK 4.1 |"
            echo "| tablet-${ver}-macos | macOS 11+ universal | GUI (Tauri) | intel + arm64, 未签名 |"
            echo "| tablet-cli-${ver}-macos | macOS 11+ universal | CLI | 同上 |"
            echo "| Tablet-${ver}.app.zip | macOS 11+ universal | GUI 便携包 | 解压直接运行 |"
            echo "| Tablet-${ver}.dmg | macOS 11+ universal | GUI 安装包 | 拖入 Applications |"
          } > release-notes.md
          cat release-notes.md

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release/*
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
