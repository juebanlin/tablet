name: ci
# 触发: 所有分支的 push + PR。发版仍走 release.yml（tag）。
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  rust:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      # app-slint 是 workspace 成员，cargo test --workspace 要链接它，缺这些会挂在链接期
      - name: install linux gui deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libfontconfig1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev

      - name: cargo test --workspace
        run: cargo test --workspace

  codegen-smoke:
    # 生成的代码必须真的能编译、能跑起来读数据。
    #
    # 只断言生成器吐出的字符串是不够的 —— 「C# Loader 因为静态构造器惰性而静默不加载
    # 任何表」就是这么漏出去的：所有字符串级测试都是绿的，产物却完全不可用。
    # 详见 docs/11 §3.3。
    name: codegen smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      # 各 setup-* 一律用当前大版本（v4/v5 那批还跑在 Node 20 上，runner 已经在报弃用）
      - name: setup java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          # 仓库里没有 go.mod / go.sum（Go 只是 e2e 里编一下生成代码），
          # 开着模块缓存会在 restore 阶段报 "Dependencies file is not found"
          cache: false

      - name: setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      # TypeScript 产物此前没有任何 e2e 覆盖；tsc 走 npm 全局装
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      - name: install tsc
        run: npm install -g typescript

      - name: install c++ / lua deps
        run: |
          sudo apt-get update
          sudo apt-get install -y nlohmann-json3-dev lua5.4

      # Java 产物默认用 Lombok 的 @Getter（export.server.java.lombok=true），
      # e2e 的 lombok=true 分支要 lombok.jar 才能编译。Lombok 与 JDK 严格绑定：
      # 版本太旧会在处理器初始化时崩（本机 JDK 25 + 1.18.30 即如此），随 JDK 一起升。
      - name: download lombok
        run: |
          curl -fsSL -o /tmp/lombok.jar \
            https://repo1.maven.org/maven2/org/projectlombok/lombok/1.18.48/lombok-1.18.48.jar

      # 11_e2e 覆盖 java / go / csharp / cpp / lua / typescript 六种产物的
      # 「编译 + 跑起来读数据」。run_all.sh 默认按 dev profile 编（CLAUDE.md），
      # 缺工具链的用例 SKIP 而不是假装通过。
      - name: codegen roundtrip
        env:
          LOMBOK_JAR: /tmp/lombok.jar
        run: ./tests/run_all.sh 11_e2e
