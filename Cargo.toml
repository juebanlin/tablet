[workspace]
members = ["crates/core", "crates/app-slint", "crates/app-cli"]
resolver = "2"

# workspace 级版本号：单一真理源（@docs/03 / docs/00）。
# 三个 crate 都用 `version.workspace = true` 继承本字段；改版本只需在这里改一次。
[workspace.package]
version = "2.0.1"

[profile.dev]
# 编译速度优先（agent 默认走 dev，频繁 cargo check / build）
opt-level = 0
debug = "line-tables-only"   # 只留行号信息，砍掉变量/类型 debuginfo，链接显著变快
incremental = true
codegen-units = 256

[profile.release]
# 性能优先，体积次之（最终交付 / 性能验证用）
opt-level = 3
lto = "fat"
codegen-units = 1
# 保留符号表、只剥 debuginfo。崩溃日志(tablet-crash.log)里的调用栈靠符号表才能把地址
# 翻成函数名：Linux/macOS 符号在二进制自身，windows-gnu 同样编进 exe。
# 别改回 strip = true —— 那会连符号表一起剥掉，堆栈只剩 "stack backtrace:" 一行空壳。
strip = "debuginfo"
