[package]
name = "tablet-cli"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
build = "build.rs"

[lib]
name = "tablet_cli"
path = "src/lib.rs"

[[bin]]
name = "tablet-cli"
path = "src/main.rs"

[dependencies]
tablet-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[build-dependencies]
winresource = "0.1"
