[package]
name = "tablet-cli"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "tablet_cli"
path = "src/lib.rs"

[[bin]]
name = "tablet-cli"
path = "src/main.rs"

[dependencies]
tablet-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = "0.4"
toml = "0.8"
