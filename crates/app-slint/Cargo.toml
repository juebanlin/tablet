[package]
name = "tablet-slint"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
build = "build.rs"

[[bin]]
name = "tablet"
path = "src/main.rs"

[dependencies]
tablet-core = { path = "../core" }
tablet-cli = { path = "../app-cli" }
slint = { version = "1.16.1", default-features = false, features = [
    "std",                  # 桌面环境必需
    "compat-1-2",           # 1.x API 兼容
    "backend-winit",        # winit 窗口/事件后端（跨 Win/macOS/Linux）
    "renderer-femtovg",     # OpenGL 硬件加速渲染（默认走这条）
    "renderer-software",    # CPU 兜底：无 GPU 驱动 / OpenGL 上下文创建失败时降级（@09）
] }
clap = { version = "4", features = ["derive"] }
log = "0.4"
simplelog = "0.12"
chrono = "0.4"
anyhow = "1"
arboard = "3"
rfd = "0.15"
open = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

[build-dependencies]
slint-build = "1.16.1"
