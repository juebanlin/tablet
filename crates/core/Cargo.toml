[package]
name = "tablet-core"
version.workspace = true
edition = "2021"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
log = "0.4"
chrono = "0.4"
encoding_rs = "0.8"
pinyin = "0.10"

# ── Excel（xlsx）：三个库各司其职，均为各自领域成熟选择，勿轻易合并/替换 ──
# 只写：新建带样式表头 / 冻结窗格 / 工作表保护的 xlsx。
# 用于 excel.rs（导出一张/一组表）与 excel_sync.rs::write_fresh_xlsx（无既有文件时新建）。
rust_xlsxwriter = "0.95"
# 只读：把策划改完的 xlsx 回读成强类型 Data，做严格表头/列数校验（excel.rs::import_xlsx_into_group）。
calamine = "0.35"
# 读 + 写 + 保格式：原地编辑既有 xlsx 不丢其已有样式（excel_sync.rs 同步引擎，S22 同步面板）。
umya-spreadsheet = "3"

[dev-dependencies]
# 只给测试用：直接读 xlsx 的 zip 条目，钉住「没被同步的 sheet 是原始字节直通」这条
# 保真契约（lazy_read 的核心，见 excel_sync.rs 模块注释）。umya 自己用的就是它。
zip = "8"
