[package]
name = "tbl-egui"
version = "0.1.0"
edition = "2021"

[dependencies]
tbl-core = { path = "../core" }
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow"] }
egui_extras = { version = "0.28", features = ["all_loaders"] }
clap = { version = "4", features = ["derive"] }
font-kit = "0.14"
log = "0.4"
simplelog = "0.12"
chrono = "0.4"
arboard = "3"
anyhow = "1"
rfd = "0.15"
