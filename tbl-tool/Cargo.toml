[package]
name = "tbl-tool"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow"] }
egui_extras = { version = "0.28", features = ["all_loaders"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
font-kit = "0.14"
log = "0.4"
simplelog = "0.12"
chrono = "0.4"
arboard = "3"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
