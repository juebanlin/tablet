# Cargo 构建配置 (workspace 范围, 自动加载)
# ------------------------------------------------------------
# Windows GUI 走 Tauri，必须使用 msvc target（gnu 下 WebView2Loader 是外挂 DLL，
# 破坏单 exe）。本机默认宿主可能是 gnu，编发布包用：
#   cargo +stable-x86_64-pc-windows-msvc build --release -p tablet
# 或直接调发布脚本：
#   bash scripts/release.sh windows
#
# 不需要 +crt-static：Tauri 的 WebView2Loader 已静态链接；msvc 运行库由系统 /
# VC++ 可再发行包提供（Win10/11 普遍已装）。dev 构建保持默认即可。
